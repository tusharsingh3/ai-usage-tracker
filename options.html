<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Usage Tracker — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      --bg-color: #121110;
      --text-color: #f5f2eb;
      --border-color: #282523;
      --select-bg: #1c1a19;
      --title-color: #ffffff;
      --sub-color: #968f89;
    }
    body.light-theme {
      --bg-color: #f9f8f6;
      --text-color: #1c1a19;
      --border-color: #e5e2de;
      --select-bg: #fff;
      --title-color: #121110;
      --sub-color: #706a65;
    }
    body {
      width: 360px;
      margin: 0 auto;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text-color);
      background: var(--bg-color);
      font-size: 13px;
      padding: 20px;
      transition: background-color 0.3s, color 0.3s;
    }
    h1 { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: var(--title-color); }
    .sub { font-size: 11px; color: var(--sub-color); margin-bottom: 18px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 12px; color: var(--sub-color); margin-bottom: 6px; }
    select {
      width: 100%;
      padding: 7px 8px;
      font-size: 13px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--select-bg);
      color: var(--text-color);
    }
    .saved {
      font-size: 11px;
      color: #1D9E75;
      margin-top: 8px;
      height: 14px;
      opacity: 0;
      transition: opacity .15s ease;
    }
    .saved.show { opacity: 1; }
  </style>
</head>
<body>
  <h1>AI Usage Tracker — Settings</h1>
  <div class="sub">Configure how often usage is automatically refreshed.</div>

  <div class="field">
    <label for="interval">Auto-refresh interval</label>
    <select id="interval">
      <option value="1">Every 1 minute (Testing)</option>
      <option value="5">Every 5 minutes</option>
      <option value="10">Every 10 minutes</option>
      <option value="15">Every 15 minutes</option>
      <option value="20">Every 20 minutes</option>
      <option value="25">Every 25 minutes</option>
      <option value="30">Every 30 minutes</option>
    </select>
  </div>

  <div class="field" style="margin-top: 20px;">
    <label style="font-weight: 600; font-size: 13px; color: var(--title-color); margin-bottom: 8px;">Push Notifications (For Claude Usage Only)</label>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label style="display: flex; align-items: center; gap: 8px; color: var(--text-color); cursor: pointer; font-size: 13px; margin-bottom: 0;">
        <input type="checkbox" id="notify-50">
        <span>Notify on 50% session limit crossed</span>
      </label>
      <label style="display: flex; align-items: center; gap: 8px; color: var(--text-color); cursor: pointer; font-size: 13px; margin-bottom: 0;">
        <input type="checkbox" id="notify-80">
        <span>Notify on 80% overall limit crossed</span>
      </label>
      <label style="display: flex; align-items: center; gap: 8px; color: var(--text-color); cursor: pointer; font-size: 13px; margin-bottom: 0;">
        <input type="checkbox" id="notify-100">
        <span>Notify when limit is reached (100%)</span>
      </label>
    </div>
  </div>

  <div class="field" style="margin-top: 20px;">
    <label style="font-weight: 600; font-size: 13px; color: var(--title-color); margin-bottom: 8px;">Integrations</label>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label style="display: flex; align-items: center; gap: 8px; color: var(--text-color); cursor: pointer; font-size: 13px; margin-bottom: 0;">
        <input type="checkbox" id="show-copilot">
        <span>Show GitHub Copilot tab <span style="display:inline-block;font-size:9px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;background:#e58c77;color:#fff;border-radius:3px;padding:1px 4px;vertical-align:middle;">beta</span></span>
      </label>
    </div>
  </div>

  <div class="saved" id="saved">Saved</div>

  <script src="options.js"></script>
</body>
</html>
