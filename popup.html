<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Claude Usage Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: #121110;
      color: #f5f2eb;
      padding: 16px;
      overflow: hidden;
    }

    /* Scrollbar styling just in case */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #282523;
      border-radius: 2px;
    }

    /* Main Layout */
    .app-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-badge {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background-color: #e58c77;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #121110;
      font-weight: 700;
      font-size: 13px;
      line-height: 1;
    }

    .app-title {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.2px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 500;
      color: #58b385;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #58b385;
      box-shadow: 0 0 8px rgba(88, 179, 133, 0.6);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.5; }
    }

    /* Bento Card Base */
    .bento-card {
      background: #1c1a19;
      border: 1px solid #282523;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .bento-card:hover {
      border-color: #383431;
    }

    .card-label {
      font-size: 9px;
      font-weight: 600;
      color: #968f89;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    /* Large Weekly Card */
    .weekly-value {
      font-size: 38px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.1;
      letter-spacing: -0.5px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background-color: #2b2826;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 12px;
      margin-bottom: 8px;
      border: 0.5px solid #33302d;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 10px;
      background: linear-gradient(90deg, #e58c77, #f4b2a3);
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .reset-text {
      font-size: 11px;
      color: #968f89;
      font-weight: 400;
    }

    /* Columns for Session & Org */
    .grid-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Circular Card Layout */
    .circle-card-content {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    .circle-svg-wrap {
      position: relative;
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }

    .circle-svg-wrap svg {
      transform: rotate(-90deg);
      display: block;
    }

    .circle-text-center {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
      color: #ffffff;
    }

    .circle-details {
      display: flex;
      flex-direction: column;
      gap: 1px;
      overflow: hidden;
    }

    .circle-val-text {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }

    .circle-sub-text {
      font-size: 9px;
      color: #968f89;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Extra Charges Card */
    .extra-charges-card {
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
    }

    .extra-charges-left {
      display: flex;
      flex-direction: column;
    }

    .extra-charges-val {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }

    .extra-charges-badge {
      font-size: 10px;
      font-weight: 600;
      color: #58b385;
      background-color: rgba(88, 179, 133, 0.08);
      border: 1px solid rgba(88, 179, 133, 0.2);
      border-radius: 20px;
      padding: 4px 10px;
      line-height: 1.1;
      text-transform: capitalize;
    }

    /* Refresh Button */
    .btn-refresh {
      width: 100%;
      background: #1c1a19;
      border: 1px solid #282523;
      border-radius: 12px;
      color: #968f89;
      padding: 10px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-refresh:hover {
      background: #282523;
      color: #ffffff;
      border-color: #383431;
    }

    .btn-refresh:active {
      transform: scale(0.98);
    }

    .btn-refresh svg {
      transition: transform 0.4s ease;
    }

    .btn-refresh.loading svg {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Footer info */
    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #706a65;
      padding: 0 4px;
    }

    .footer-link {
      color: #968f89;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .footer-link:hover {
      color: #ffffff;
    }

    /* Fallback DOM-based View / No data Empty View styling */
    .empty-view {
      padding: 30px 16px;
      text-align: center;
      color: #968f89;
      line-height: 1.6;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .empty-view a {
      color: #e58c77;
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px dashed #e58c77;
    }

    .empty-view a:hover {
      color: #f4b2a3;
      border-bottom-style: solid;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="popup.js"></script>
</body>
</html>
