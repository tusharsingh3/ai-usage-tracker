<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AI Usage Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Theme CSS Variables */
    body {
      --bg-color: #121110;
      --text-color: #f5f2eb;
      --card-bg: #1c1a19;
      --card-border: #282523;
      --card-border-hover: #383431;
      --label-color: #968f89;
      --text-white: #ffffff;
      --bar-bg: #2b2826;
      --bar-border: #33302d;
      --btn-bg: #1c1a19;
      --btn-hover: #282523;
      --btn-text: #968f89;
      --btn-text-hover: #ffffff;
      --footer-text: #706a65;
      --footer-link: #968f89;
      --footer-link-hover: #ffffff;
      --empty-link: #e58c77;
      --empty-link-hover: #f4b2a3;
      --circle-empty: #2b2826;
    }

    body.light-theme {
      --bg-color: #f9f8f6;
      --text-color: #1c1a19;
      --card-bg: #ffffff;
      --card-border: #e5e2de;
      --card-border-hover: #d5d2ce;
      --label-color: #706a65;
      --text-white: #121110;
      --bar-bg: #f0ede9;
      --bar-border: #e5e2de;
      --btn-bg: #ffffff;
      --btn-hover: #f0ede9;
      --btn-text: #706a65;
      --btn-text-hover: #121110;
      --footer-text: #968f89;
      --footer-link: #706a65;
      --footer-link-hover: #121110;
      --empty-link: #e58c77;
      --empty-link-hover: #d97b65;
      --circle-empty: #f0ede9;
    }

    body {
      width: 320px;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 12px;
      overflow: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--card-border);
      border-radius: 2px;
    }

    /* Main Layout */
    .app-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-badge {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background-color: #e58c77;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #121110;
      font-weight: 700;
      font-size: 13px;
      line-height: 1;
    }

    .app-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-white);
      letter-spacing: -0.2px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 500;
      color: #58b385;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #58b385;
      box-shadow: 0 0 8px rgba(88, 179, 133, 0.6);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.5; }
    }

    /* Theme Toggle Button */
    .theme-toggle-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--btn-text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .theme-toggle-btn:hover {
      background: var(--btn-hover);
      color: var(--btn-text-hover);
    }

    /* Service Toggle (Claude | Copilot) */
    .service-toggle {
      display: flex;
      background: var(--bar-bg);
      border: 1px solid var(--bar-border);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }

    .service-btn {
      flex: 1;
      padding: 4px 10px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--label-color);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, color 0.15s;
    }

    .service-btn.active {
      background: #5f6af8;
      color: #fff;
    }

    .service-btn:not(.active):hover {
      background: var(--btn-hover);
      color: var(--btn-text-hover);
    }

    /* Bento Card Base */
    .bento-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s ease, transform 0.2s ease, background-color 0.3s ease;
    }

    .bento-card:hover {
      border-color: var(--card-border-hover);
    }

    .card-label {
      font-size: 8px;
      font-weight: 600;
      color: var(--label-color);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
    }

    /* Large Weekly Card */
    .weekly-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-white);
      line-height: 1.1;
      letter-spacing: -0.5px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background-color: var(--bar-bg);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 8px;
      margin-bottom: 4px;
      border: 0.5px solid var(--bar-border);
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 10px;
      background: linear-gradient(90deg, #e58c77, #f4b2a3);
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .reset-text {
      font-size: 10px;
      color: var(--label-color);
      font-weight: 400;
    }

    /* Columns for Session & Org */
    .grid-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Circular Card Layout */
    .circle-card-content {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    .circle-svg-wrap {
      position: relative;
      width: 38px;
      height: 38px;
      flex-shrink: 0;
    }

    .circle-svg-wrap svg {
      transform: rotate(-90deg);
      display: block;
      width: 100%;
      height: 100%;
    }

    .circle-text-center {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      font-weight: 700;
      color: var(--text-white);
    }

    .circle-details {
      display: flex;
      flex-direction: column;
      gap: 1px;
      overflow: hidden;
    }

    .circle-val-text {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-white);
      line-height: 1.2;
    }

    .circle-sub-text {
      font-size: 8px;
      color: var(--label-color);
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Extra Charges Card */
    .extra-charges-card {
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
    }

    .extra-charges-left {
      display: flex;
      flex-direction: column;
    }

    .extra-charges-val {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-white);
      line-height: 1.2;
    }

    .extra-charges-badge {
      font-size: 9px;
      font-weight: 600;
      color: #58b385;
      background-color: rgba(88, 179, 133, 0.08);
      border: 1px solid rgba(88, 179, 133, 0.2);
      border-radius: 20px;
      padding: 4px 10px;
      line-height: 1.1;
      text-transform: capitalize;
    }

    /* Plan Details Card */
    .plan-details-card {
      padding: 12px 14px;
    }
    .plan-details-content {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }
    .plan-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .plan-type-badge {
      font-size: 9px;
      font-weight: 700;
      color: #121110;
      background-color: #e58c77;
      border-radius: 6px;
      padding: 3px 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }
    .plan-type-badge.plan-free {
      background-color: var(--label-color);
      color: var(--card-bg);
    }
    .plan-type-badge.plan-pro {
      background-color: #dfb86c;
      color: #121110;
    }
    .plan-type-badge.plan-team {
      background-color: #58b385;
      color: #121110;
    }
    .plan-type-badge.plan-enterprise {
      background-color: #534ab7;
      color: #ffffff;
    }
    .plan-billing-cycle {
      font-size: 10px;
      color: var(--label-color);
      font-weight: 500;
    }
    .plan-dates {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      border-top: 1px solid var(--bar-border);
      padding-top: 8px;
    }
    .plan-date-col {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .date-label {
      font-size: 8px;
      font-weight: 600;
      color: var(--label-color);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .date-value {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-white);
    }

    /* Refresh Button */
    .btn-refresh {
      width: 100%;
      background: var(--btn-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--btn-text);
      padding: 10px;
      font-family: inherit;
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-refresh:hover {
      background: var(--btn-hover);
      color: var(--btn-text-hover);
      border-color: var(--card-border-hover);
    }

    .btn-refresh:active {
      transform: scale(0.98);
    }

    .btn-refresh svg {
      transition: transform 0.4s ease;
    }

    .btn-refresh.loading svg {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Footer info */
    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--footer-text);
      padding: 0 4px;
    }

    .footer-row span {
      font-size: 11px;
      font-family: inherit;
      font-weight: 500;
    }

    .footer-link {
      color: var(--footer-link);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
      font-size: 11px;
      font-family: inherit;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .footer-link:hover {
      color: var(--footer-link-hover);
    }

    /* Fallback DOM-based View / No data Empty View styling */
    .empty-view {
      padding: 30px 16px;
      text-align: center;
      color: var(--label-color);
      line-height: 1.6;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .empty-view a {
      color: var(--empty-link);
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px dashed var(--empty-link);
    }

    .empty-view a:hover {
      color: var(--empty-link-hover);
      border-bottom-style: solid;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="popup.js"></script>
</body>
</html>
